:root{--a:#ffd400;--b:#ff3b1d;--btn:#ffd400;--onb:#fffaf0;--ink:#111;--paper:#fff6dc;--on:#111;--disp:Anton,Impact,"Avenir Next Condensed","Roboto Condensed","Arial Black",system-ui,sans-serif;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;height:100%;overflow:hidden;background:var(--a);color:var(--ink);font:700 16px/1.25 var(--ui);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#root{position:fixed;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--a)}
#home::before{content:"";position:absolute;left:50%;top:44%;width:190vmax;height:190vmax;margin:-95vmax;background:repeating-conic-gradient(rgba(0,0,0,.055) 0 15deg,transparent 0 30deg);animation:spin 80s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 2px;min-height:52px;color:var(--on)}
.bar.tight{padding:6px 8px 4px;min-height:50px;background:var(--a);flex:none}
h1{margin:0;font:900 25px/1 var(--disp);letter-spacing:.3px;text-transform:uppercase;transform:rotate(-1.5deg);transform-origin:left}
.mini{display:flex;gap:4px}
.mini button,.ico{min-width:44px;height:44px;border:0;background:transparent;font-size:17px;font-weight:900;color:var(--on);border-radius:50%;display:grid;place-items:center}
#me,#edstyle{font-size:24px}
#pad{position:relative;flex:1;min-height:0;margin:4px 18px 16px}
.under,#leaf{position:absolute;inset:0;background:var(--paper);border:3px solid var(--ink);border-radius:6px}
.under.u1{transform:rotate(1.6deg) translate(3px,5px)}.under.u2{transform:rotate(-2.2deg) translate(-2px,8px);background:var(--b)}
#leaf{display:flex;flex-direction:column;padding:26px 16px 14px;transform:rotate(-.8deg);box-shadow:5px 6px 0 var(--ink);touch-action:none;will-change:transform;transition:transform .22s cubic-bezier(.2,1.2,.4,1)}
#leaf.drag{transition:none}
#leaf.gone{transition:transform .32s cubic-bezier(.5,0,.9,.5),opacity .32s;opacity:0}
#leaf.enter{animation:slap .42s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slap{from{transform:scale(1.25) rotate(4deg);opacity:0}}
.holes{position:absolute;left:10px;right:10px;top:7px;height:13px;background:radial-gradient(circle at 50% 50%,var(--a) 0 5px,var(--ink) 5px 6.5px,transparent 7px) 0 0/25px 13px repeat-x}
.dateline{display:flex;align-items:center;gap:8px;min-height:60px;position:relative}
.dnum{font:900 62px/.9 var(--disp);letter-spacing:-1px;color:var(--ink);font-variant-numeric:tabular-nums}
.dmon{font:900 15px/1.05 var(--ui);text-transform:uppercase;white-space:pre-line}
.burst{margin-left:auto;display:grid;place-items:center;width:84px;height:84px;margin-top:-6px;margin-right:-4px;background:var(--b);color:var(--onb);text-align:center;font:900 13px/1.05 var(--ui);transform:rotate(9deg);white-space:pre-line;clip-path:polygon(50% 0,61% 13%,78% 7%,80% 24%,97% 28%,88% 44%,100% 58%,84% 66%,84% 84%,66% 82%,54% 98%,42% 85%,24% 92%,21% 74%,4% 69%,13% 53%,1% 39%,17% 31%,17% 13%,35% 16%)}
.enter .burst{animation:pop2 .5s .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes pop2{from{transform:scale(0) rotate(-60deg)}}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:var(--ink);font:900 100px/.95 var(--disp);text-transform:uppercase;text-align:center}
.hero span{display:block;flex:none;white-space:nowrap;text-shadow:.035em .035em 0 var(--b)}
.enter .hero span{animation:stamp .34s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*110ms + 90ms)}
@keyframes stamp{from{transform:scale(2.3);opacity:0}}
.teaser{margin:8px 0 0;font:800 18px/1.2 var(--ui);text-wrap:balance;text-align:center}
.from{margin:4px 0 0;font-size:14px;text-align:center}
.press{display:block;margin:0 18px 8px;width:calc(100% - 36px);min-height:68px;border:3px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--btn);font:900 30px/1 var(--disp);text-transform:uppercase;letter-spacing:.6px;box-shadow:0 6px 0 var(--b);transition:transform 90ms ease-out,box-shadow 90ms ease-out;position:relative;flex:none}
.press:active{transform:translateY(5px);box-shadow:0 1px 0 var(--b)}
.press.wait{background:transparent;color:#111;border-style:dashed;box-shadow:none;font-size:22px}
#homerow{position:relative;flex:none;display:flex;gap:8px;margin:2px 18px 6px}
#homerow button{flex:1;min-height:44px;border:2px solid var(--on);border-radius:6px;background:transparent;color:var(--on);font:900 14px/1.1 var(--ui);padding:2px 6px}
#homerow button[hidden]{display:none}
/* The feature bar runs by slowly as a ticker; it stops under a finger or the mouse, and on short screens it is left out. */
#feat{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:0 0 6px 18px}
#feat .lane{flex:1;min-width:0;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 18px),transparent);mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 18px),transparent)}
#feat .track{display:flex;gap:6px;width:max-content;padding-left:8px;animation:ticker 45s linear infinite}
#feat .lane:hover .track,#feat .lane:focus-within .track,#feat.hold .track{animation-play-state:paused}
@keyframes ticker{to{transform:translateX(-50%)}}
@media (max-height:700px){#feat{display:none}}
@media (prefers-reduced-motion:reduce){#feat .lane{overflow-x:auto;scrollbar-width:none}#feat .track{animation:none}#feat .track [aria-hidden]{display:none}}
#edsave[aria-pressed=true]{color:#ff3d71}
/* feel-good card: the optional name above the button, and a soft arrival for whoever gets one */
.warmto{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:-8px 18px 8px;color:var(--on);font:800 14px/1.2 var(--ui)}
.warmto[hidden]{display:none}
.warmto .field{flex:1;width:auto;min-width:120px;min-height:44px;margin:0;user-select:text;-webkit-user-select:text}
.warmwarn{flex-basis:100%;font-size:13px}.warmwarn:empty{display:none}
#leaf.warmin{animation:lift .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes lift{from{transform:translateY(46px) scale(.9) rotate(-.8deg);opacity:0}}
.wh{position:absolute;bottom:16%;left:calc(14% + var(--i) * 13%);color:var(--b);font:900 34px/1 var(--ui);pointer-events:none;animation:rise 1.7s calc(var(--i) * 110ms + .35s) ease-out both}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}to{transform:translateY(-240px) scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){#leaf.warmin{animation:none}.wh{display:none}}
#feat button{flex:none;min-height:40px;padding:0 11px;border:2px solid var(--ink);border-radius:20px;background:var(--paper);color:var(--ink);font:800 13px var(--ui);white-space:nowrap}
.pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0 6px}
.pv[hidden]{display:none}
.pv canvas{max-width:100%;max-height:100%;border:2px solid var(--ink);display:block}
.pvcard{height:100%;aspect-ratio:4/5}
.pv canvas[hidden]{display:none}
.pv:not([hidden]) ~ .hero{flex:0 0 84px}
.hero[hidden]{display:none}
#tools{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:0 10px 8px;flex:none}
#tools button{min-height:48px;border:0;background:transparent;color:var(--on);font:800 13px/1.1 var(--ui);padding:2px}
