<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src 'self': the browser itself refuses to send anything to another host. The server repeats this as a header. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob:; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f2a44">
<title>Fast Easy Protokoll</title>
<style>
/* Fast Easy Protokoll: sober business look, system fonts, works from 320 px. */
:root { --ink: #1f2a44; --soft: #5b6478; --line: #d9dde6; --bg: #f5f6f9; --card: #fff; --acc: #2457d6; --rec: #d62d2d; --warn: #8a5a00; --warnbg: #fff5dc; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
header h1 { margin: 8px 0 0; font-size: 1.6rem; }
.claim { margin: 2px 0 16px; color: var(--soft); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
h2 { font-size: 1.15rem; margin: 0 0 8px; }
.facts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.field { display: grid; gap: 4px; margin: 12px 0; font-weight: 600; font-size: .95rem; }
input[type=text], select, textarea { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; background: #fff; color: var(--ink); }
textarea { resize: vertical; }
.consent { border: 1px solid var(--line); border-left: 4px solid var(--acc); border-radius: 8px; padding: 12px; margin: 12px 0; background: #f8faff; }
.say { margin: 0 0 8px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
.check input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.btn, .small { font: inherit; border-radius: 8px; border: 1px solid var(--acc); background: var(--acc); color: #fff; padding: 12px 16px; font-weight: 700; cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.big { width: 100%; font-size: 1.05rem; padding: 14px; }
.small { padding: 8px 12px; background: #fff; color: var(--acc); font-weight: 600; }
.danger { color: var(--rec); border-color: var(--rec); background: #fff; }
.link { background: none; border: 0; color: var(--acc); font: inherit; text-align: left; padding: 4px 0; cursor: pointer; flex: 1; }
.row { display: flex; gap: 8px; margin: 12px 0; }
.row > .btn { flex: 1; }
.row.wrap { flex-wrap: wrap; }
.note { color: var(--soft); font-size: .9rem; }
.warn { background: var(--warnbg); color: var(--warn); border-radius: 8px; padding: 8px 10px; }
.ok { color: #1d6b35; }
progress, meter { width: 100%; height: 10px; }
.live { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; padding: 10px 12px; border-radius: 10px; background: #fdeaea; color: var(--rec); }
.live #clock { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
#rec.paused .live { background: #eef0f4; color: var(--soft); }
#rec.paused .dot { background: var(--soft); animation: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.stop { background: var(--rec); border-color: var(--rec); }
.lines { list-style: none; padding: 0; margin: 12px 0; max-height: 45vh; overflow: auto; display: grid; gap: 6px; }
.lines li { display: flex; gap: 8px; }
.lines time { color: var(--soft); font-variant-numeric: tabular-nums; flex: none; }
.protocol section.part { border: 0; border-radius: 0; padding: 0; background: none; }
.row.wrap > .btn { flex: 1 1 30%; padding: 12px 8px; }
.protocol h2 { font-size: 1.3rem; margin-bottom: 0; }
.protocol .meta { color: var(--soft); margin-top: 2px; }
.protocol h3 { font-size: 1rem; margin: 14px 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.protocol ul { margin: 0; padding-left: 20px; }
.protocol .task b { color: var(--acc); }
.protocol .task em { color: var(--soft); font-style: normal; }
.protocol .src { color: var(--soft); font-size: .85rem; font-style: italic; margin-top: 14px; }
.saved { list-style: none; padding: 0; display: grid; gap: 6px; }
.saved li { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
pre { white-space: pre-wrap; word-break: break-word; max-height: 30vh; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: .85rem; }
.foot { color: var(--soft); font-size: .8rem; margin-top: 16px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 560px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 10px; padding: 12px 14px; }

</style>
</head>
<body>
<main>
  <header><h1 data-t="title"></h1><p class="claim" data-t="claim"></p></header>

  <section id="intro">
    <ul class="facts">
      <li data-t="factAudio"></li>
      <li data-t="factModel"></li>
      <li data-t="factAi"></li>
      <li data-t="factYours"></li>
    </ul>
    <p id="fit"></p>
    <label class="field"><span data-t="model"></span>
      <select id="model"><option value="tiny" data-t="modelTiny"></option><option value="base" data-t="modelBase"></option></select></label>
    <label class="field"><span data-t="names"></span><input id="names" type="text" maxlength="400" autocomplete="off"></label>
    <div class="consent">
      <p class="say"><b data-t="sayHead"></b> <span data-t="say"></span></p>
      <label class="check"><input id="consent" type="checkbox"> <span data-t="consent"></span></label>
    </div>
    <button id="start" class="btn big" type="button" data-t="start"></button>
    <div id="load" hidden><progress id="loadbar" max="1" value="0"></progress><p id="loadtext" class="note"></p></div>
    <div id="savedbox" hidden>
      <h2 data-t="saved"></h2>
      <ul id="saved" class="saved"></ul>
      <button id="delall" class="small danger" type="button" data-t="deleteAll"></button>
    </div>
  </section>

  <section id="rec" hidden>
    <div class="live" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><b id="recstate" data-t="recording"></b><span id="clock">00:00</span></div>
    <p class="note" id="recnames"></p>
    <meter id="level" min="0" max="1" value="0" aria-hidden="true"></meter>
    <p id="lag" class="warn" hidden></p>
    <ol id="lines" class="lines" aria-live="polite"></ol>
    <div class="row"><button id="pause" class="btn" type="button" data-t="pause"></button><button id="stop" class="btn stop" type="button" data-t="stop"></button></div>
    <p class="note" data-t="recNote"></p>
  </section>

  <section id="review" hidden>
    <h2 data-t="review"></h2>
    <p id="finishing" class="note" data-t="finishing" hidden></p>
    <label class="field"><span data-t="transcript"></span><textarea id="transcript" rows="10"></textarea></label>
    <label class="field"><span data-t="names"></span><input id="rnames" type="text" maxlength="400" autocomplete="off"></label>
    <div class="row"><button id="mklocal" class="btn" type="button" data-t="mkLocal"></button><button id="mkai" class="btn" type="button" data-t="mkAi"></button></div>
    <div id="aiask" class="consent" hidden>
      <p data-t="aiWhat"></p>
      <p id="aisize" class="note"></p>
      <details><summary data-t="aiShow"></summary><pre id="aipreview"></pre></details>
      <label class="check"><input id="aiok" type="checkbox"> <span data-t="aiConsent"></span></label>
      <button id="aisend" class="btn" type="button" data-t="aiSend"></button>
    </div>
    <button id="discard" class="small danger" type="button" data-t="discard"></button>
  </section>

  <section id="result" hidden>
    <p id="note" class="warn" hidden></p>
    <article id="protocol" class="protocol"></article>
    <label class="check"><input id="withtext" type="checkbox"> <span data-t="withText"></span></label>
    <div class="row wrap">
      <button id="copy" class="btn" type="button" data-t="copy"></button>
      <button id="download" class="btn" type="button" data-t="download"></button>
      <button id="share" class="btn" type="button" data-t="share"></button>
    </div>
    <div class="row"><button id="again" class="small" type="button" data-t="again"></button><button id="del" class="small danger" type="button" data-t="delete"></button></div>
  </section>
  <p class="foot" data-t="foot"></p>
</main>
<div id="toast" role="alert" hidden></div>

<script>
/* Fast Easy Protokoll: the rules, without DOM. A meeting is written down on this device and turned into a short protocol.

   Data flow (nothing else leaves the device):

     microphone ──PCM──▶ resample 16 kHz ──▶ Chunker (cuts at pauses) ──▶ whisper.cpp in a Worker ──text──▶ transcript
         │                                                                     ▲
         └─ audio stays in memory and is dropped after each piece              model + runtime: own domain, HTTPS, cached
     transcript ──▶ summary on the device (rules, always possible, also offline)
               └──▶ only after an explicit "yes": redacted TEXT ──HTTPS──▶ /api/duell/ai kind "protokoll"
                                                          (own local model, no cache, the text is not logged) ──▶ protocol JSON, checked here
     protocol ──▶ this device's storage (delete any time) ──▶ text export, share sheet

   Everything here is pure so node can test it; protokoll-page.js does the DOM, the microphone and the worker. */
(function (root) {
  "use strict";
  var RATE = 16000;
  // The same files and digests as the gallery's /d/untertitel (CADS-DEMO-wrapper static/vendor/untertitel/PROVENANCE.json):
  // whisper.cpp v1.8.2 as wasm (@transcribe/shout 1.0.7, MIT) and the OpenAI Whisper weights (MIT), quantised by whisper.cpp.
  var VENDOR = "/static/vendor/untertitel/";
  var RUNTIME = { file: "shout.wasm.js", sha256: "e6aaa9c243013518393410d48a8930c9b98b17719baafb4dfd307a6ff9c45866", bytes: 1547886 };
  var MODELS = {
    tiny: { file: "ggml-tiny-q5_1.bin", sha256: "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7", bytes: 32152673 },
    base: { file: "ggml-base-q5_1.bin", sha256: "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898", bytes: 59707625 }
  };
  var MAX_TEXT = 12000, MAX_NAMES = 12, MAX_NAME = 40, MAX_KEEP = 50;

  // Which model this device can carry, or an honest no. dev: { wasm, worker, isolated, media, mem (GB, often missing), cores, mobile }
  function pickModel(dev) {
    if (!dev.wasm || !dev.worker || !dev.isolated || !dev.media) return { ok: false, why: "browser" };
    if (typeof dev.mem === "number" && dev.mem < 2) return { ok: false, why: "weak" };
    var cores = dev.cores || 2;
    if ((typeof dev.mem === "number" && dev.mem < 4) || cores < 4 || (dev.mobile && cores < 6)) return { ok: true, model: "tiny", note: "small" };
    return { ok: true, model: "base", note: "" };
  }
  function threads(dev) { return Math.min(dev.mobile ? 4 : 8, Math.max(1, (dev.cores || 2) - 1)); }

  // Linear resampling to 16 kHz. Not studio quality, enough for speech recognition.
  function resample(input, from) {
    if (from === RATE) return Float32Array.from(input);
    var ratio = from / RATE, n = Math.floor(input.length / ratio), out = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var x = i * ratio, a = Math.floor(x), b = Math.min(a + 1, input.length - 1), f = x - a;
      out[i] = input[a] * (1 - f) + input[b] * f;
    }
    return out;
  }
  function rms(pcm, from, to) {
    var s = 0, n = 0;
    for (var i = Math.max(0, from); i < Math.min(to, pcm.length); i++) { s += pcm[i] * pcm[i]; n++; }
    return n ? Math.sqrt(s / n) : 0;
  }

  // Collects 16 kHz audio and cuts it into pieces for the recogniser: at a pause once minSec are there, at the latest at maxSec.
  // A piece without speech (quiet throughout) is dropped, so whisper never gets silence to invent text from.
  function Chunker(o) {
    o = o || {};
    var minSec = o.minSec || 8, maxSec = o.maxSec || 25, pauseSec = o.pauseSec || 0.6, quiet = o.quiet || 0.012;
    var buf = [], len = 0, at = 0;      // at: start of the buffered audio, in samples since the start
    function flat() { var out = new Float32Array(len), p = 0; buf.forEach(function (b) { out.set(b, p); p += b.length; }); return out; }
    function cut(n) {
      var all = flat(), piece = all.slice(0, n), rest = all.slice(n), start = at;
      buf = rest.length ? [rest] : []; len = rest.length; at += n;
      return rms(piece, 0, piece.length) < quiet ? null : { pcm: piece, start: start / RATE, sec: piece.length / RATE };
    }
    return {
      push: function (pcm) {
        buf.push(pcm); len += pcm.length;
        var out = [];
        while (len >= maxSec * RATE) { var c = cut(maxSec * RATE); if (c) out.push(c); }
        if (len >= minSec * RATE) {
          var all = flat(), p = Math.floor(pauseSec * RATE);
          if (rms(all, all.length - p, all.length) < quiet) { var d = cut(len); if (d) out.push(d); }
        }
        return out;
      },
      flush: function () { return len ? cut(len) : null; },
      buffered: function () { return len / RATE; }
    };
  }

  // whisper fills silence and noise with lines it learned from subtitles. These never belong in a protocol.
  var NOISE = [/untertitel(ung)?\s+(im\s+auftrag\s+)?(des|der|von)\b/i, /^\s*(vielen\s+)?dank\s+f(ü|ue)r(s|'s)?\s+(das\s+)?zu(schauen|sehen|h(ö|oe)ren)/i,
    /copyright\s+(wdr|zdf|ard|swr|ndr)/i, /amara\.org/i, /^\s*thanks?\s+(you\s+)?for\s+watching/i, /subtitles?\s+by\b/i];
  function cleanSegment(s) {
    var t = String(s == null ? "" : s).replace(/\[[^\]]*\]|\([^)]*\)|\*[^*]*\*|♪+/g, " ").replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim();
    if (!/[\p{L}\p{N}]/u.test(t)) return "";
    return NOISE.some(function (r) { return r.test(t); }) ? "" : t;
  }
  // A recogniser result (whisper.cpp: { transcription: [{ text }] } or plain text) -> one clean line, "" when nothing was said.
  function resultText(r) {
    var parts = typeof r === "string" ? [r] : (r && Array.isArray(r.transcription) ? r.transcription.map(function (x) { return x && x.text; }) : []);
    return parts.map(cleanSegment).filter(Boolean).join(" ").trim();
  }
  function stamp(sec) { sec = Math.max(0, Math.floor(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }

  // Names typed in before the start: besides what the AI reads from the text, the only way people get into the list.
  function cleanNames(s) {
    var seen = {};
    return String(s == null ? "" : s).split(/[,;\n]+/).map(function (n) { return n.replace(/[^\p{L}\p{N} .'-]/gu, "").replace(/\s+/g, " ").trim().slice(0, MAX_NAME); })
      .filter(function (n) { var k = n.toLowerCase(); if (!n || seen[k]) return false; seen[k] = 1; return true; }).slice(0, MAX_NAMES);
  }

  // Contact data and account numbers have no business in the text that leaves the device; the page shows what goes out.
  function redact(text) {
    return String(text)

      var e = el("li", "task"); e.appendChild(el("b", "", x.who || L.open)); e.appendChild(el("span", "", " " + x.what)); if (x.due) e.appendChild(el("em", "", " · " + x.due)); return e;
    }));
    box.appendChild(el("p", "src", L[p.source]));
    $("note").hidden = !note; $("note").textContent = note || "";
    show("result");
  }
  function exportText() { return P.toText(rec, lang, $("withtext").checked); }
  async function copy() { try { await navigator.clipboard.writeText(exportText()); toast(t("copied")); } catch (e) { toast(t("errCopy")); } }
  function download() {
    var a = el("a"); a.href = URL.createObjectURL(new Blob([exportText()], { type: "text/markdown;charset=utf-8" }));
    a.download = "protokoll-" + new Date(rec.at).toISOString().slice(0, 10) + ".md"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  async function share() {
    if (!navigator.share) { copy(); return; }
    try { await navigator.share({ title: rec.protocol.title || t("title"), text: exportText() }); } catch (e) {}
  }
  function remove(id) {
    if (!confirm(t("confirmDelete"))) return;
    writeJson(STORE, P.drop(list(), id)); if (rec && rec.id === id) rec = null;
    toast(t("deleted")); fillList(); show("intro");
  }
  function removeAll() { if (!confirm(t("confirmDeleteAll"))) return; try { localStorage.removeItem(STORE); } catch (e) {} rec = null; toast(t("deleted")); fillList(); }

  // ---- start screen -------------------------------------------------------------------------------------------------
  function fillList() {
    var l = list(), ul = $("saved"); ul.textContent = "";
    $("savedbox").hidden = !l.length;
    l.forEach(function (r) {
      var li = el("li"), when = new Date(r.at).toLocaleString(lang === "en" ? "en-GB" : "de-DE", { dateStyle: "short", timeStyle: "short" });
      li.appendChild(btn(((r.protocol && r.protocol.title) || t("title")) + " · " + when, "link", function () { rec = r; if (r.protocol) result(""); }));
      li.appendChild(btn(t("delete"), "small danger", function () { remove(r.id); }));
      ul.appendChild(li);
    });
  }
  function intro() {
    var f = $("fit"), mb = Math.round((P.RUNTIME.bytes + P.MODELS[model].bytes) / 1e6);
    if (!fit.ok) { f.textContent = t(fit.why === "weak" ? "fitWeak" : "fitBrowser"); f.className = "warn"; $("start").disabled = true; }
    else { f.textContent = t(model === "tiny" && fit.note === "small" ? "fitSmall" : "fitOk", { mb: mb }); f.className = fit.note ? "warn" : "ok"; }
    $("model").value = model; $("model").disabled = !fit.ok;
    fillList();
  }

  document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.dataset.t); });
  document.documentElement.lang = lang; document.title = t("title");
  $("model").addEventListener("change", function () { model = $("model").value === "base" ? "base" : "tiny"; intro(); });
  $("start").addEventListener("click", start);
  $("pause").addEventListener("click", pause);
  $("stop").addEventListener("click", stop);
  $("mklocal").addEventListener("click", function () { if (!$("transcript").value.trim()) { toast(t("empty")); return; } localProtocol(""); });
  $("mkai").addEventListener("click", askAi);
  $("aisend").addEventListener("click", sendAi);
  $("discard").addEventListener("click", function () { if (confirm(t("confirmDiscard"))) { rec = null; fillList(); show("intro"); } });
  $("copy").addEventListener("click", copy);
  $("download").addEventListener("click", download);
  $("share").addEventListener("click", share);
  $("del").addEventListener("click", function () { if (rec) remove(rec.id); });
  $("again").addEventListener("click", function () { rec = null; fillList(); show("intro"); });
  $("delall").addEventListener("click", removeAll);
  // Leaving the page ends the recording: nothing goes on unseen in the background of a closed tab.
  window.addEventListener("pagehide", function () { if (live) live.stream.getTracks().forEach(function (k) { k.stop(); }); });
  intro();
  window.ProtokollDebug = { rec: function () { return rec; }, live: function () { return !!live; }, model: function () { return model; } };
})();

</script>
</body>
</html>
