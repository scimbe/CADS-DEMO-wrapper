name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dependency-free: no install step. Boots the server without LLM credentials; the vendored wasm
      # is checked against static/vendor/manifest-core-wasm/PROVENANCE.json.
      - run: node --test test/*.mjs
