# demos.bunsenbrenner.org — deploy the demo-gallery wrapper behind the CADS-Tunnel Browser Plane,
# following the SAME shape as examples/cookbook-demo (ct-agent onboard + an origin service).
#
#   1. Put a fresh single-use join token + your edge/CP values in ./.env (see .env.template).
#   2. docker compose up -d --build
#   3. curl https://demos.bunsenbrenner.org/   -> should hit the wrapper.
#
# The wrapper serves plain HTTP on :8790; the ct-agent (onboard) terminates the tunnel and
# proxies to it (CT_AGENT_ORIGIN, proto tcp — per core's guidance, no separate cert/hostname:
# the hostname is bound to the token server-side).
services:
  demos-origin:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:?shared litellm proxy base}
      - LITELLM_API_KEY=${LITELLM_API_KEY:?shared litellm proxy key}
      - LITELLM_DEFAULT_MODEL=${LITELLM_DEFAULT_MODEL:-local-qwen36-35b-a3b-coding}
      # "Installationen speichern": aus, solange kein Token gesetzt ist (siehe lib/installations.mjs).
      - INSTALLATIONS_DELEGATE_TOKEN=${INSTALLATIONS_DELEGATE_TOKEN:-}
      - INSTALLATIONS_LIVE=${INSTALLATIONS_LIVE:-}
      # "Sandbox auf deinem Gerät": aus, bis hier ein veröffentlichter Release steht (cads-run-v0.1.0).
      - CADS_RUN_VERSION=${CADS_RUN_VERSION:-}
      - CT_MANIFEST_TRUST_ALLOWLIST=${CT_MANIFEST_TRUST_ALLOWLIST:-1292c0cc8da75808549be709101acec612a52d5219b188c0adcff6d829ace69b}
      # erklaervideo: voice "Thomas" through the ct-agent channel (audio_generation) -- same mechanism as the
      # call-center app: a READ-ONLY mount with ct-agent + relay.env, no published ports. Without it the demo
      # fails honestly with "TTS nicht konfiguriert".
      - CT_AGENT_BIN=/opt/ct-channel/ct-agent
      - CT_RELAY_ENV=/opt/ct-channel/relay.env
      - CT_AUDIO_CHANNEL_ID=${CT_AUDIO_CHANNEL_ID:-}
    volumes:
      - ${CT_CHANNEL_DIR:-./channel}:/opt/ct-channel:ro
    expose:
      - "8790"          # reachable only via the agent, not published to the host
    restart: unless-stopped

  demos-agent:
    # workspace ct-agent image, built from the CADS-Tunnel source (same as cookbook/help-site)
    build:
      context: ${CT_TUNNEL_SRC:-../CADS-Tunnel}
      dockerfile: docker/Dockerfile
      args:
        - CRATE=ct-agent
    environment:
      - CT_AGENT_CP_URL=${CT_AGENT_CP_URL:-https://bunsenbrenner.org}
      - CT_AGENT_JOIN_TOKEN=${DEMOS_JOIN_TOKEN:?fresh single-use join token for demos.bunsenbrenner.org}
      - CT_AGENT_ID=demos-wrapper
      - CT_AGENT_ORIGIN=demos-origin:8790
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_EDGE=${DEMOS_AGENT_EDGE:-}          # edge host:port, if your plane needs it
      - CT_AGENT_EDGE_CERT_URL=${DEMOS_AGENT_EDGE_CERT_URL:-}
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent        # restart-safe onboarding
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    command: ["ct-agent", "onboard"]
    depends_on:
      - demos-origin
    restart: unless-stopped
    volumes:
      - demos_agent_state:/var/lib/ct-agent

volumes:
  demos_agent_state:

networks:
  default:
    name: demos-wrapper_default
